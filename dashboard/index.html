    <title>Sentinel — Security Dashboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        --color-background-secondary: #f8f9fa;
        --color-background-tertiary: #f0f2f5;

        --color-text-secondary: #6b7280;
        --color-border: #e5e7eb;
        --color-danger: #dc2626;
        --color-warning: #d97706;
        --color-success: #16a34a;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--color-text); background: var(--color-background-tertiary); }
